<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="csrf-token" content="{{ csrf_token }}">
  <meta name="robots" content="noindex">
  <title>{{ title }} · qlang admin</title>
  <script src="/theme.js"></script>
  <link rel="stylesheet" href="/site.css">
  <link rel="stylesheet" href="/prose.css">
  <link rel="stylesheet" href="/admin.css">
</head>
<body class="admin">
  <header class="top"><div class="wrap">
    <a class="brand" href="/admin">q<b>lang</b> <span class="muted">admin</span></a>
    <div class="tools">
      <span class="theme icons" role="group" aria-label="Thème"><button type="button" data-theme-set="light" title="Clair" aria-label="Clair"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg></button><button type="button" data-theme-set="dark" title="Sombre" aria-label="Sombre"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg></button><button type="button" data-theme-set="system" title="Auto" aria-label="Auto"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="12" rx="2"/><path d="M8 20h8M12 16v4"/></svg></button></span>
      {% if login %}
      <details class="user-menu">
        <summary aria-label="Compte {{ login }}"><span class="avatar" data-name="{{ login }}"></span></summary>
        <div class="user-body">
          <p class="who"><span class="muted">Connecté</span><br>{{ login }}</p>
          <a href="/fr/docs" target="_blank" rel="noopener">Voir le site ↗</a>
          <form method="post" action="/admin/logout">{{ csrf | raw }}<button class="link" type="submit">Se déconnecter</button></form>
        </div>
      </details>
      {% end %}
    </div>
    {% if login %}
    <nav class="main">
      <a href="/admin" {% if nav_dashboard %}aria-current="page"{% end %}>Tableau de bord</a>
      <a href="/admin/docs" {% if nav_docs %}aria-current="page"{% end %}>Documentation</a>
      <a href="/admin/import" {% if nav_import %}aria-current="page"{% end %}>Import</a>
      <a href="/admin/releases" {% if nav_releases %}aria-current="page"{% end %}>Versions</a>
      <a href="/admin/audit" {% if nav_audit %}aria-current="page"{% end %}>Journal</a>
      {% if is_admin %}<a href="/admin/packages" {% if nav_packages %}aria-current="page"{% end %}>Paquets</a>{% end %}
      {% if is_admin %}<a href="/admin/accounts" {% if nav_accounts %}aria-current="page"{% end %}>Comptes</a>{% end %}
    </nav>
    {% end %}
  </div></header>
  <main class="wrap">
    {% if flash %}<div class="flash {% if flash_ok %}flash-ok{% else %}flash-error{% end %}" role="status">{{ flash }}</div>{% end %}
    {{ content | raw }}
  </main>
  <script src="/theme-toggle.js"></script>
  <script src="/menu.js"></script>
  <script src="/admin.js"></script>
  <script src="/editor.js"></script>
</body>
</html>
