<h1>Nouvelle page</h1>
<form method="post" action="/admin/pages" class="stack">
  {{ csrf | raw }}
  <input type="hidden" name="locale" value="{{ locale }}">
  <div class="row">
    <label class="grow">Titre <input name="title" value="{{ title }}" required autofocus></label>
    <label class="grow">Adresse <input name="slug" value="{{ slug }}" placeholder="générée depuis le titre"></label>
    <label>Dossier
      <select name="folder">{% for f in folders %}<option value="{{ f.value }}" {% if f.selected %}selected{% end %}>{{ f.label }}</option>{% end %}</select>
    </label>
  </div>
  <div class="split-tabs" role="tablist" aria-label="Affichage"><button type="button" role="tab" data-pane="edit" aria-selected="true">Éditeur</button><button type="button" role="tab" data-pane="preview" aria-selected="false">Aperçu</button></div>
  <div class="split" data-pane="edit">
    <label class="pane-edit">Markdown <textarea id="markdown" name="markdown" class="editor" rows="22" spellcheck="false">{{ markdown }}</textarea></label>
    <div class="pane-preview">
      <h2 class="small">Aperçu <span class="muted" id="preview-state"></span></h2>
      <div id="preview" class="prose card"></div>
    </div>
  </div>
  <div><button class="btn primary" type="submit">Créer la page</button> <a class="btn" href="/admin/docs?locale={{ locale }}">Annuler</a></div>
</form>
