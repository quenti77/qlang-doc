<main class="wrap narrow">
  <h1>Inscription</h1>
  {% if open %}
  {% if has_error %}<div class="flash flash-error">{{ error }}</div>{% end %}
  <form method="post" action="/account/register" class="stack">
    {{ csrf | raw }}
    <label>Identifiant <input name="login" value="{{ login }}" autocomplete="username" minlength="3" required autofocus></label>
    <label>Mot de passe <input name="password" type="password" autocomplete="new-password" minlength="12" required></label>
    <label>Confirmer le mot de passe <input name="password2" type="password" autocomplete="new-password" minlength="12" required></label>
    <p class="muted">12 caractères au minimum.</p>
    <button class="btn primary" type="submit">Créer mon compte</button>
  </form>
  <p class="muted">Déjà inscrit ? <a href="/account/login">Connexion</a>.</p>
  {% else %}
  <p>Les inscriptions sont fermées pour l'instant.</p>
  {% end %}
</main>
